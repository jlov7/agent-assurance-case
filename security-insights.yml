---
# yamllint disable rule:line-length
header:
  schema-version: 2.2.0
  last-updated: "2026-05-25"
  last-reviewed: "2026-05-25"
  url: https://raw.githubusercontent.com/jlov7/agent-assurance-case/main/security-insights.yml
  comment: |
    Self-reported OpenSSF Security Insights metadata for the Agent Assurance
    Case repository. This file makes the repository security posture
    machine-readable; it is not an independent security review.

project:
  name: Agent Assurance Case
  homepage: https://github.com/jlov7/agent-assurance-case
  administrators:
    - name: Jason Mark Lovell
      affiliation: Independent
      primary: true
  documentation:
    quickstart-guide: https://github.com/jlov7/agent-assurance-case#quick-start
    detailed-guide: https://github.com/jlov7/agent-assurance-case/blob/main/SPEC.md
    code-of-conduct: https://github.com/jlov7/agent-assurance-case/blob/main/CODE_OF_CONDUCT.md
    release-process: https://github.com/jlov7/agent-assurance-case/blob/main/PUBLICATION.md
    support-policy: https://github.com/jlov7/agent-assurance-case/blob/main/SECURITY.md
    signature-verification: https://github.com/jlov7/agent-assurance-case/blob/main/RELEASE_FINGERPRINTS.md
  repositories:
    - name: agent-assurance-case
      url: https://github.com/jlov7/agent-assurance-case
      comment: |
        Draft AAC specification, JSON Schema, profiles, conformance vectors,
        examples, and reference verifier.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/jlov7/agent-assurance-case/blob/main/SECURITY.md
    contact:
      name: GitHub private vulnerability reporting
      primary: true
    in-scope:
      - signature verification bypass
      - hash or canonicalization confusion
      - duplicate-key or JSON parser ambiguity
      - profile enforcement bypass
      - evidence reference binding failure
    out-of-scope:
      - detector correctness outside the reference verifier
      - legal compliance certification
      - production key management or enterprise trust-store policy

repository:
  url: https://github.com/jlov7/agent-assurance-case
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Jason Mark Lovell
      affiliation: Independent
      primary: true
  documentation:
    contributing-guide: https://github.com/jlov7/agent-assurance-case/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/jlov7/agent-assurance-case/blob/main/SECURITY_POSTURE.md
    governance: https://github.com/jlov7/agent-assurance-case/blob/main/CONTRIBUTING.md
    review-policy: https://github.com/jlov7/agent-assurance-case/blob/main/SECURITY_POSTURE.md
    security-policy: https://github.com/jlov7/agent-assurance-case/blob/main/SECURITY.md
  license:
    url: https://github.com/jlov7/agent-assurance-case/blob/main/LICENSE.md
    expression: Apache-2.0 AND CC-BY-4.0
  release:
    automated-pipeline: true
    changelog: https://github.com/jlov7/agent-assurance-case/blob/main/CHANGELOG.md
    distribution-points:
      - uri: https://github.com/jlov7/agent-assurance-case/releases
        comment: GitHub Releases.
      - uri: https://doi.org/10.5281/zenodo.20379393
        comment: Zenodo DOI for the current AAC release candidate.
  security:
    assessments:
      self:
        evidence: https://github.com/jlov7/agent-assurance-case/blob/main/SECURITY_POSTURE.md
        date: "2026-05-25"
        comment: |
          Self-assessed repository posture covering protected-branch policy,
          required checks, release fingerprints, Scorecard interpretation, and
          explicit non-claims. No independent third-party security review is
          claimed.
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - security-extended
          - security-and-quality
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: Runs on pull requests, main pushes, and a weekly schedule.
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: Required protected-branch check; remaining maturity findings are documented in SECURITY_POSTURE.md.
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: GitHub Actions and Python requirement updates plus Dependabot security updates are enabled.
      - name: GitHub secret scanning
        type: secret
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: Secret scanning and push protection are enabled for the public repository.
      - name: ClusterFuzzLite
        type: fuzzing
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: PR fuzzing is configured for parser, verifier, schema, and fuzz-harness changes.
