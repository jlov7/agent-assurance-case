<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent Assurance Case</title>
  <desc id="desc">AAC wordmark showing a signed evidence record with deterministic verification.</desc>
  <defs>
