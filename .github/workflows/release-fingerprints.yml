---
name: release-fingerprints

"on":
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-release-fingerprint:
    name: Verify AAC release fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      # The release gate (run against the cloned signed tag) shells out to
      # uv/uvx for the dependency-lock, SBOM audit, Bandit, REUSE, and
      # shellcheck checks, so uv must be on PATH in this job.
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Verify release fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_fingerprints.py
