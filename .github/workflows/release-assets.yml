---
name: release-assets

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed AAC release tag.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-attest-upload:
    name: Build, attest, and upload AAC release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout AAC repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Verify release target exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Run release gate from signed tag checkout
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git worktree add /tmp/aac-release-tree "$TAG"
          cd /tmp/aac-release-tree
          ./VERIFY-PUBLICATION-READY.sh

      - name: Build release assets from signed tag commit
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/build_release_assets.sh "$TAG" dist/release

      - name: Check release asset upload safety
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          for asset in dist/release/*; do
            name="$(basename "$asset")"
            local_digest="sha256:$(shasum -a 256 "$asset" | awk '{print $1}')"
            remote_digest="$(
              gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq ".assets[] | select(.name == \"$name\") | .digest"
            )"
            if [[ -n "$remote_digest" ]] &&
              [[ "$remote_digest" != "$local_digest" ]]; then
              printf 'asset exists with different digest: %s\n' "$name" >&2
              printf 'remote=%s local=%s\n' "$remote_digest" "$local_digest" >&2
              exit 1
            fi
          done

      - name: Generate GitHub artifact attestation
        uses: >-
          actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: dist/release/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          for asset in dist/release/*; do
            name="$(basename "$asset")"
            local_digest="sha256:$(shasum -a 256 "$asset" | awk '{print $1}')"
            remote_digest="$(
              gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq ".assets[] | select(.name == \"$name\") | .digest"
            )"
            if [[ -z "$remote_digest" ]]; then
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            elif [[ "$remote_digest" == "$local_digest" ]]; then
              printf 'asset already uploaded with matching digest: %s\n' "$name"
            else
              printf 'asset exists with different digest: %s\n' "$name" >&2
              printf 'remote=%s local=%s\n' "$remote_digest" "$local_digest" >&2
              exit 1
            fi
          done
