---
name: release-assets

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed AAC release tag.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-attest-upload:
    name: Build, attest, and upload AAC release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout AAC repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Verify release target exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Run release gate from signed tag checkout
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git worktree add /tmp/aac-release-tree "$TAG"
          cd /tmp/aac-release-tree
          ./VERIFY-PUBLICATION-READY.sh

      - name: Build release assets from signed tag commit
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/build_release_assets.sh "$TAG" dist/release

      - name: Generate GitHub artifact attestation
        uses: >-
          actions/attest-build-provenance@c4fbc648846ca6f503a13a2281a5e7b98aa57202
        with:
          subject-path: dist/release/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh release upload "$TAG" dist/release/*
          --repo "$GITHUB_REPOSITORY"
