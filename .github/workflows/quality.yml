---
name: quality

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Run ruff
        run: uvx ruff check --no-cache verifier tests scripts fuzz

      - name: Run pyright
        run: >-
          uv run
          --with-requirements verifier/requirements-dev.txt
          --with pyright
          pyright verifier tests scripts fuzz

      - name: Audit Python dependencies
        run: >-
          uv run
          --with-requirements verifier/requirements-dev.txt
          --with pip-audit
          pip-audit

      - name: Run Bandit
        run: >-
          uvx bandit
          -q
          -r verifier scripts fuzz
          -x tests
          -s B404,B603,B607

      - name: Run codespell
        run: uvx codespell . --skip './.git,./.venv'

      - name: Check REUSE licensing metadata
        run: uvx reuse lint

      - name: Check Markdown local links
        run: python scripts/check_markdown_links.py

      - name: Check public artifact hygiene
        run: python scripts/check_public_hygiene.py

      - name: Validate Security Insights metadata
        run: scripts/validate_security_insights.sh

      - name: Validate repository posture metadata
        run: >-
          uv run
          --with-requirements verifier/requirements.txt
          python scripts/verify_repository_posture.py

      - name: Validate CodeMeta metadata
        run: >-
          uv run
          --with-requirements verifier/requirements.txt
          python scripts/validate_codemeta.py

      - name: Validate citation metadata
        run: >-
          uv run
          --with-requirements verifier/requirements.txt
          python scripts/validate_citation.py

      - name: Validate CFF syntax
        run: >-
          uvx --from cffconvert
          cffconvert --validate --infile CITATION.cff

      - name: Run shellcheck
        run: >-
          uvx --from shellcheck-py
          shellcheck
          VERIFY-PUBLICATION-READY.sh
          .clusterfuzzlite/build.sh
          scripts/build_release_assets.sh
          scripts/validate_security_insights.sh
