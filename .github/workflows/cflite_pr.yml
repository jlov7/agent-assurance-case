---
name: clusterfuzzlite

"on":
  pull_request:
    paths:
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"
      - "fuzz/**"
      - "schemas/**"
      - "tests/test_fuzz_harnesses.py"
      - "verifier/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-fuzzing:
    name: ClusterFuzzLite PR fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build Python fuzzers
        id: build
        uses: >-
          google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        with:
          language: python
          sanitizer: address

      - name: Run Python fuzzers
        id: run
        uses: >-
          google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 60
          mode: code-change
          sanitizer: address
