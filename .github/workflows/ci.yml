---
# GitHub Actions workflow for the AAC reference verifier.
#
# Runs on every push and pull request:
#   - installs runtime and dev Python dependencies
#   - runs the verifier test suite
#   - checks published canonicalization and sign/verify vectors
#   - verifies all three bundled example AACs with --allow-demo-key
#   - verifies all three bundled example AACs with the published demo public key
#   - validates the shipped JSON Schema as a Draft 2020-12 schema
#   - runs the publication-readiness gate script
#
# A failed CI run blocks merges.

name: aac-verifier

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      # Keep Hypothesis' example database out of the working tree so the
      # standalone pytest step does not leave a .hypothesis/ directory that the
      # publication gate's junk check would later (correctly) reject.
      HYPOTHESIS_STORAGE_DIRECTORY: "/tmp/aac-hypothesis"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install dependencies
        run: |
          uv pip install --system \
            -r verifier/requirements.txt \
            -r verifier/requirements-dev.txt

      - name: Run verifier test suite
        run: |
          python -m pytest \
            tests/ \
            -v \
            -p no:cacheprovider \
            --basetemp=/tmp/aac-pytest

      - name: Compile release fingerprint verifier
        run: |
          python -m py_compile scripts/verify_release_fingerprints.py
          rm -rf scripts/__pycache__

      - name: Check conformance vectors
        run: |
          python verifier/check_vectors.py

      - name: Verify pass-with-coverage example
        run: |
          python verifier/verify.py \
            examples/pass-with-coverage.json \
            --allow-demo-key

      - name: Verify skill-poisoning-hold example
        run: |
          python verifier/verify.py \
            examples/skill-poisoning-hold.json \
            --allow-demo-key

      - name: Verify critical-exfiltration-fail example
        run: |
          python verifier/verify.py \
            examples/critical-exfiltration-fail.json \
            --allow-demo-key

      - name: Verify examples with published demo key
        run: |
          python verifier/verify.py \
            examples/pass-with-coverage.json \
            --public-key keys/demo-issuer-v0.2.pub
          python verifier/verify.py \
            examples/skill-poisoning-hold.json \
            --public-key keys/demo-issuer-v0.2.pub
          python verifier/verify.py \
            examples/critical-exfiltration-fail.json \
            --public-key keys/demo-issuer-v0.2.pub

      - name: Validate JSON Schema metaschema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = (
              Path("schemas") / "agent-assurance-case-v0.2.schema.json"
          )
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          PY

      - name: Validate release evidence JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("release-evidence.schema.json").read_text())
          evidence = json.loads(
              Path("release-evidence.v0.2-candidate.8.json").read_text()
          )
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(
              schema,
              format_checker=FormatChecker(),
          ).validate(evidence)
          PY

      - name: Run publication-readiness gate
        run: |
          chmod +x VERIFY-PUBLICATION-READY.sh
          ./VERIFY-PUBLICATION-READY.sh
