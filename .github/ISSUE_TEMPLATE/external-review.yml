---
name: External review
description: >-
  Share an independent AAC review, implementation result, or conformance
  critique.
title: "[review] "
labels:
  - review
body:
  - type: dropdown
    id: review_type
    attributes:
      label: Review type
      options:
        - Independent verifier or parser
        - Canonicalization or signature vectors
        - Spec conformance
        - Schema/profile/verifier consistency
        - Evidence binding
        - Privacy or evidence references
        - Threat model or limitations
        - Deployment feedback
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target release or commit
      description: Use v0.2-candidate.8 or a full commit SHA.
      placeholder: v0.2-candidate.8
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What did you review, implement, reproduce, or challenge?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        Include commands, output, vector IDs, file paths, or a minimal AAC case.
        For parser/verifier reviews, include `python3 verifier/check_vectors.py`
        output from the v0.2-candidate.8 release tag/current main or equivalent
        byte-level conformance output against the test vectors.
      render: shell
    validations:
      required: true
  - type: textarea
    id: structured_report
    attributes:
      label: Structured review report
      description: >-
        For ledger consideration, attach or paste a filled
        `review-report-template.json`.
        Use N/A only if this is an informal discussion issue rather than a
        ledger candidate.
      render: json
    validations:
      required: false
  - type: textarea
    id: structured_report_validation
    attributes:
      label: Structured report validation
      description: >-
        For ledger consideration, include output from
        `python3 verifier/validate_review_report.py path/to/review-report.json`.
        Expected success output is `AAC review report: valid submission.` Use
        N/A only if this is an informal discussion issue rather than a ledger
        candidate.
      render: shell
    validations:
      required: false
  - type: textarea
    id: finding
    attributes:
      label: Finding or result
      description: State the observed behavior and why it matters.
    validations:
      required: true
  - type: dropdown
    id: disposition
    attributes:
      label: Suggested disposition
      options:
        - No change; independent confirmation
        - Documentation clarification
        - Spec change
        - Schema change
        - Verifier change
        - Test/vector addition
        - Security-sensitive; moving to private report
    validations:
      required: true
